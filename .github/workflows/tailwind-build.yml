name: Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "js/**/*.js"
      - "src/input.css"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: tailwind-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Tailwind CSS
        run: npm run build:css

      - name: Commit generated CSS
        run: |
          git add css/tailwind.css
          if git diff --cached --quiet; then
            echo "Tailwind CSS is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build Tailwind CSS"
          git push
